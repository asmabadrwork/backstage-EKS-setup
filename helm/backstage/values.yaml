# Production Domain Configuration
domain: ""

# Backstage Application Configuration
backstage:
  replicaCount: 3
  image:
    repository: ""
    tag: ""
    pullPolicy: Always
  imagePullSecrets:
    - name: ecr-secret
  service:
    type: ClusterIP
    port: 80
    targetPort: 7007
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  probes:
    liveness:
      path: /.well-known/healthcheck
      initialDelaySeconds: 60
      periodSeconds: 15
    readiness:
      path: /.well-known/healthcheck
      initialDelaySeconds: 30
      periodSeconds: 10

# Amazon RDS for PostgreSQL Database Configuration (Multi-AZ)
postgres:
  createSecret: false # Set to false when using External Secrets Operator (AWS Secrets Manager)
  host: ""
  port: 5432
  user: ""
  password: ""
  database: postgres
  ssl: true

# TLS Configuration
tls:
  enabled: true
  secretName: backstage-tls

# Application Secrets Management
secrets:
  create: false # Set to false when using externalSecrets (AWS Secrets Manager)
  name: backstage-secrets
  githubToken: ""
  backendSecret: ""
  authOidcClientId: "backstage"
  authOidcClientSecret: ""

# AWS Secrets Manager Integration (External Secrets Operator)
externalSecrets:
  enabled: true # Set to true when syncing secrets directly from AWS Secrets Manager
  awsSecretName: "production/backstage"
  secretStore:
    name: aws-secrets-manager
    region: ap-south-1
    serviceAccountName: external-secrets-sa
