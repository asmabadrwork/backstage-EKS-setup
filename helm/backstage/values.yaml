# Production Domain Configuration
domain: ""

# Backstage Application Configuration
backstage:
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: Always
  imagePullSecrets: []
  service:
    type: ClusterIP
    port: 80
    targetPort: 7007
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  probes:
    liveness:
      path: /.well-known/healthcheck
      initialDelaySeconds: 60
      periodSeconds: 15
    readiness:
      path: /.well-known/healthcheck
      initialDelaySeconds: 30
      periodSeconds: 10

# Amazon RDS for PostgreSQL Database Configuration (Multi-AZ)
postgres:
  createSecret: false # Set to false when using External Secrets Operator (AWS Secrets Manager)
  host: ""
  port: 5432
  user: ""
  password: ""
  database: postgres
  ssl: true

# TLS Configuration
tls:
  enabled: true
  secretName: backstage-tls

# Application Secrets Management
secrets:
  create: false # Set to false when using externalSecrets (AWS Secrets Manager)
  name: backstage-secrets
  githubToken: ""
  backendSecret: ""
  authOidcClientId: "backstage"
  authOidcClientSecret: ""

# ServiceAccount Configuration for External Secrets Operator IRSA
serviceAccount:
  create: true
  name: external-secrets-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::724446904294:role/backstage-external-secrets"

# AWS Secrets Manager Integration (External Secrets Operator)
externalSecrets:
  enabled: true # Set to true when syncing secrets directly from AWS Secrets Manager
  awsSecretName: "production/backstage"
  secretStore:
    name: aws-secrets-manager
    region: ap-south-1
    serviceAccountName: external-secrets-sa

# Target Database Worker Node Pool (dev-negd-ng-db)
nodeSelector:
  eks.amazonaws.com/nodegroup: dev-negd-ng-db

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "database"
    effect: "NoSchedule"

