# Production Domain Configuration
domain: example.com

# Backstage Application Configuration
backstage:
  replicaCount: 3
  image:
    repository: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/backstage
    tag: 1.0.0
    pullPolicy: Always
  imagePullSecrets:
    - name: ecr-secret
  service:
    type: ClusterIP
    port: 80
    targetPort: 7007
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  probes:
    liveness:
      path: /healthcheck
      initialDelaySeconds: 60
      periodSeconds: 15
    readiness:
      path: /healthcheck
      initialDelaySeconds: 30
      periodSeconds: 10

# PostgreSQL Database Configuration (Configured for AWS RDS Multi-AZ)
postgres:
  enabled: false # Set to false when using external PostgreSQL (e.g. AWS RDS)
  createSecret: true # Set to false if you manually created backstage-postgres-secrets via kubectl or externalSecrets
  host: "<AWS_RDS_ENDPOINT>.ap-south-1.rds.amazonaws.com" # AWS RDS PostgreSQL endpoint
  port: 5432
  user: backstage
  password: "change-me-in-production"
  database: postgres
  ssl: true
  image: postgres:15-alpine
  persistence:
    enabled: true
    storage: 5Gi
    storageClass: "" # Empty uses cluster default StorageClass (e.g., gp3). Set to "manual" only if using hostPath PV.
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

# TLS Configuration
tls:
  enabled: true
  secretName: backstage-tls

# Application Secrets Management
secrets:
  create: true # Set to false when using externalSecrets (AWS Secrets Manager)
  name: backstage-secrets
  githubToken: ""
  backendSecret: ""

# AWS Secrets Manager Integration (External Secrets Operator)
externalSecrets:
  enabled: false # Set to true when syncing secrets directly from AWS Secrets Manager
  awsSecretName: "production/backstage"
  secretStore:
    name: aws-secrets-manager
    region: ap-south-1
    serviceAccountName: external-secrets-sa
