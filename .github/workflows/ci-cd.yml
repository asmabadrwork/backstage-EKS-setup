name: Backstage CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  CI: 'true'
  NODE_OPTIONS: '--max-old-space-size=8192'
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'backstage-production' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'backstage' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'backstage' }}

jobs:
  # =========================================================================
  # STAGE 1: CI VERIFICATION & CODE QUALITY (Runs on PR & Push)
  # =========================================================================

  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-quality:
    name: Lint & Code Quality
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Linting (repo lint)
        run: yarn backstage-cli repo lint
      - name: Deprecations Check (list-deprecations)
        run: yarn backstage-cli repo list-deprecations

  typecheck:
    name: TypeScript Type Check
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Type Checking (tsc:full)
        run: yarn tsc:full

  test:
    name: Unit & Integration Tests
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Run Tests (repo test)
        run: yarn backstage-cli repo test

  config-check:
    name: App Config Validation
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Config Validation (config:check)
        run: |
          yarn backstage-cli config:check --lax --strict \
            --config app-config.yaml \
            --config app-config.production.yaml

  # =========================================================================
  # STAGE 2: CD PRODUCTION DEPLOYMENT (Runs ONLY on push to main/master)
  # =========================================================================

  build-bundle:
    name: Build Release Bundle
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [lint-and-quality, typecheck, test, config-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Build All Packages
        run: yarn build:all
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: packages/backend/dist/

  push-ecr:
    name: Push to Amazon ECR
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-bundle
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: packages/backend/dist/

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy-eks:
    name: Deploy to EKS (Helm)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: push-ecr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Helm Chart)
        uses: actions/checkout@v4

      - name: Set up Helm v3
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.0'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig for Amazon EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Deploy Backstage via Helm
        run: |
          helm upgrade backstage ./helm/backstage \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --reuse-values \
            --set backstage.image.tag=${{ github.sha }}

      - name: Verify Deployment Rollout Status
        run: |
          kubectl rollout status deployment backstage -n ${{ env.K8S_NAMESPACE }} --timeout=180s
