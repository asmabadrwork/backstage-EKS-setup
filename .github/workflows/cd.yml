name: Backstage CD Production Deployment

on:
  push:
    branches:
      - main
      - master

# Permissions required for AWS OIDC authentication & checkout
permissions:
  id-token: write
  contents: read

env:
  CI: 'true'
  NODE_OPTIONS: '--max-old-space-size=8192'
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'backstage-production' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'backstage' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'backstage' }}

jobs:
  # STAGE 1: Secret Scanning
  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # STAGE 2: Code Validation
  validation:
    name: Lint & Type Check
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Linting
        run: yarn backstage-cli repo lint
      - name: Type Checking
        run: yarn tsc:full

  # STAGE 3: Config Validation
  config-check:
    name: Config Check
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Config Validation
        run: |
          yarn backstage-cli config:check --lax --strict \
            --config app-config.yaml \
            --config app-config.production.yaml

  # STAGE 4: Build Release Bundle
  build-bundle:
    name: Build Release Bundle
    needs: config-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Build All Packages
        run: yarn build:all
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: packages/backend/dist/

  # STAGE 5: Build Docker Container & Push to Amazon ECR via AWS OIDC
  push-ecr:
    name: Push to Amazon ECR
    needs: build-bundle
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: packages/backend/dist/

      - name: Debug OIDC & AWS Role
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          # Request and decode the raw OIDC token to see exact claims
          OIDC_RESP=$(curl -sLS -H "User-Agent: actions/oidc-client" -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          RAW_TOKEN=$(echo "$OIDC_RESP" | jq -r '.value // empty')
          if [ -n "$RAW_TOKEN" ]; then
            echo "--- GitHub OIDC Claims ---"
            echo "$RAW_TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, ref}' || true
          fi

      # Authenticate with AWS via OIDC (Direct Role ARN)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::628031635452:role/github-actions-backstage-cd
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # STAGE 6: Deploy to Amazon EKS Cluster via Helm & OIDC
  deploy-eks:
    name: Deploy to EKS (Helm)
    needs: push-ecr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Helm Chart)
        uses: actions/checkout@v4

      - name: Set up Helm v3
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.0'

      # Authenticate with AWS via OIDC
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::628031635452:role/github-actions-backstage-cd
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Update Kubeconfig for Amazon EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Deploy Backstage via Helm
        run: |
          helm upgrade backstage ./helm/backstage \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --reuse-values \
            --set backstage.image.tag=${{ github.sha }}

      - name: Verify Deployment Rollout Status
        run: |
          kubectl rollout status deployment backstage -n ${{ env.K8S_NAMESPACE }} --timeout=180s
