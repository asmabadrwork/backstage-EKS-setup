name: Backstage CI Verification

on:
  pull_request:
    branches:
      - main
      - master

env:
  CI: 'true'
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  # STAGE 1: Secret Scanning
  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # STAGE 2: Code Validation & Quality Checks
  verify:
    name: Run Official Backstage Checks
    needs: secret-scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Linting (repo lint)
        run: yarn backstage-cli repo lint

      - name: Type Checking (tsc:full)
        run: yarn tsc:full

      - name: Deprecations Check (list-deprecations)
        run: yarn backstage-cli repo list-deprecations

      - name: Run Tests (repo test)
        run: yarn backstage-cli repo test

      - name: Config Validation (config:check)
        run: |
          yarn backstage-cli config:check --lax --strict \
            --config app-config.yaml \
            --config app-config.production.yaml

      - name: Build All Packages (yarn build:all)
        run: yarn build:all
